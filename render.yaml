services:
  - type: web
    name: careeros-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/careeros.db
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
    disk:
      name: careeros-data
      mountPath: /var/data
      sizeGB: 1
